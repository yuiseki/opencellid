checked:
  note: scripts/02_verify.py, with Python's csv module and DuckDB, before upload
  items:
    - every raw file against MANIFEST.json (size and sha256); every manifest URL carries token=REDACTED
    - every gzip read to its end; header equal to the documented 14 columns
    - CSV rows counted with the csv module (5,502,843) and equal to the Parquet's
    - the typed rows of the Parquet equal the CSV's as a multiset (count and a sum of per-row hashes), and the rows are in the export's sort order
    - every geometry equals POINT(lon lat) of its row
    - GeoParquet 1.0.0 metadata, Point, no crs (OGC:CRS84), bbox within -180..180, -90..90
    - a DuckDB without extension autoloading opens it
    - no bloom filters

modifications:
  raw: none. OpenCelliD's file, byte for byte.
  parquet:
    - columns typed by name; each value matched against a regular expression before the cast; lon and lat range-checked; a value that does not fit stops the build
    - geometry column added, WKB points from lon and lat, GeoParquet metadata
    - columns kept in the CSV's order; rows sorted by mcc, net, area, then the other columns (lon and lat through their text, which keeps "-0")
    - written with zstd, without bloom filters
  not_included: the per-MCC files and the daily differential files (listed in MANIFEST.json)
