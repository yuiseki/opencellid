# Where this data comes from and what was done to it.

source:
  name: OpenCelliD cell export (world)
  publisher: OpenCelliD, run by Unwired Labs; data from OpenCelliD contributors
  homepage: https://opencellid.org
  downloads: https://opencellid.org/downloads.php
  download_url_form: https://opencellid.org/ocid/downloads?token=<API access token>&type=<full|mcc|diff>&file=<file>
  format: https://docs.opencellid.org/docs/downloads/database-format
  access: |
    The download page shows its links only after an API access token is
    posted to it. The links have the form above; type=full is the world
    file cell_towers.csv.gz. Tokens are never stored here.
  update: |
    "We generate exports daily by 02:00 GMT. They include towers observed
    in the last 18 months. You can download each file twice per day from
    our download page." (https://docs.opencellid.org/docs/getting-started/access-and-limits,
    read 2026-10-06)
  licence:
    applied: CC BY-SA 4.0 (https://docs.opencellid.org/docs/attribution, read 2026-10-06)
    legal_code: https://creativecommons.org/licenses/by-sa/4.0/legalcode
    card: "license: cc-by-sa-4.0"
    statement: "OpenCellID data is licensed under CC BY-SA 4.0, including API results, dataset downloads and daily changes."
    credit: "Cell tower data from OpenCellID (https://opencellid.org), licensed under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)."
    attribution_required: true
    indicate_changes: true
    share_alike: true
    exceptions: only in writing by Unwired Labs

